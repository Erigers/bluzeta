      <feComposite in="SourceGraphic" in2="so" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0"/>
    </filter>
  </defs>

  <ellipse cx="128" cy="226" rx="54" ry="11" fill="#101218" opacity="0.2" filter="url(#bz-shadow)"/>

